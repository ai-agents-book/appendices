<svg viewBox="0 0 940 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HTTP request and response exchange</title>
<desc>A client sends a request containing a method, URL, headers, and an optional body to a server. The server validates the request, applies application logic, and returns a response carrying a status code and a body.</desc>
<defs>
<marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#3f6a92"/>
</marker>
</defs>
<rect width="940" height="300" fill="#ffffff"/>

<!-- Client -->
<rect x="50" y="70" width="260" height="170" rx="10" fill="#dceaf7" stroke="#1d4e89" stroke-width="2"/>
<text x="180" y="100" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1d4e89" font-weight="700" text-anchor="middle">Client</text>
<text x="72" y="134" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f6a92">method + URL</text>
<text x="72" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f6a92">headers</text>
<text x="72" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f6a92">optional body</text>

<!-- Server -->
<rect x="630" y="70" width="260" height="170" rx="10" fill="#dceaf7" stroke="#1d4e89" stroke-width="2"/>
<text x="760" y="100" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1d4e89" font-weight="700" text-anchor="middle">Server</text>
<text x="652" y="134" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f6a92">validate request</text>
<text x="652" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f6a92">apply application logic</text>
<text x="652" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f6a92">return response</text>

<!-- annotation: what the response carries -->
<rect x="365" y="28" width="210" height="34" rx="8" fill="#f4f8fc" stroke="#c4d7e8" stroke-width="1.5"/>
<text x="470" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d4e89" text-anchor="middle">status code + body</text>

<!-- request arrow -->
<line x1="310" y1="142" x2="625" y2="142" stroke="#3f6a92" stroke-width="2.25" marker-end="url(#arrow-api)"/>
<text x="470" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d4e89" font-weight="700" text-anchor="middle">request</text>

<!-- response arrow -->
<line x1="625" y1="196" x2="310" y2="196" stroke="#3f6a92" stroke-width="2.25" marker-end="url(#arrow-api)"/>
<text x="470" y="216" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d4e89" font-weight="700" text-anchor="middle">response</text>
</svg>
